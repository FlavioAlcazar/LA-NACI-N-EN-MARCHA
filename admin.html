<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administración — La Nación en Marcha</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #cfcfcb;
            color: #111;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            background: #111;
            color: #eee;
            padding: 25px 5%;
            border-bottom: 8px solid #777;
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            line-height: .85;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 60px 5%;
        }

        .title {
            border-bottom: 8px solid #111;
            padding-bottom: 25px;
            margin-bottom: 50px;
        }

        .title h1 {
            margin: 0;
            font-size: clamp(55px, 9vw, 100px);
            line-height: .8;
            letter-spacing: -6px;
            text-transform: uppercase;
        }

        .form-row {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        input,
        select,
        textarea {
            width: 100%;
            border: 2px solid #111;
            background: #eee;
            padding: 15px;
            color: #111;
            font-family: inherit;
            font-size: 16px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: 4px solid #999;
        }

        textarea {
            min-height: 350px;
            resize: vertical;
            font-family: Georgia, "Times New Roman", serif;
            line-height: 1.6;
        }

        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .file-box {
            border: 2px dashed #111;
            padding: 25px;
            background: #ddd;
        }

        button {
            margin-top: 20px;
            background: #111;
            color: #eee;
            border: 0;
            padding: 18px 30px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .notice {
            display: none;
            margin-top: 25px;
            border: 3px solid #111;
            padding: 20px;
            font-weight: bold;
        }


        /* =========================
           EDITAR / VISTA PREVIA
           ========================= */

        .preview-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid #111;
            padding-bottom: 15px;
        }

        .preview-controls button {
            margin-top: 0;
        }

        .preview-controls button.active {
            background: #555;
        }

        #preview {
            display: none;
            background: #dededb;
            border: 2px solid #111;
            padding: 50px 6%;
            margin-bottom: 30px;
        }

        #preview .preview-type {
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        #preview h1 {
            margin: 0 0 30px;
            font-size: clamp(45px, 8vw, 90px);
            line-height: .85;
            letter-spacing: -5px;
            text-transform: uppercase;
        }

        #preview .preview-meta {
            border-top: 3px solid #111;
            border-bottom: 1px solid #555;
            padding: 15px 0;
            margin-bottom: 40px;
            font-size: 13px;
            text-transform: uppercase;
        }

        #preview .preview-description {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
            font-style: italic;
        }

        #preview .preview-content {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 20px;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        #preview .preview-pdf {
            margin-top: 30px;
            border-top: 2px solid #111;
            padding-top: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }


        /* =========================
           LOGIN
           ========================= */

        #loginScreen {
            max-width: 600px;
            margin: 100px auto;
            padding: 0 5%;
        }

        #loginBox {
            border-top: 8px solid #111;
            padding-top: 30px;
        }

        #loginBox h1 {
            margin: 0 0 30px;
            font-size: 50px;
            line-height: .9;
            letter-spacing: -3px;
            text-transform: uppercase;
        }

        #loginError {
            display: none;
            margin-top: 20px;
            border: 3px solid #111;
            padding: 15px;
            font-weight: bold;
        }

        #adminContent {
            display: none;
        }

        .logout {
            margin-top: 40px;
            background: #777;
        }

        .logout:hover {
            background: #555;
        }

        @media (max-width: 700px) {

            .two-columns {
                grid-template-columns: 1fr;
            }

            #loginScreen {
                margin-top: 60px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        La Nación<br>
        en Marcha
    </div>

</header>


<!-- =========================
     LOGIN
     ========================= -->

<div id="loginScreen">

    <div id="loginBox">

        <h1>
            Administración
        </h1>

        <form id="loginForm">

            <div class="form-row">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Introduce tu contraseña"
                    autocomplete="current-password"
                    required
                >

            </div>

            <button type="submit">
                Entrar
            </button>

        </form>


        <div id="loginError">
            Contraseña incorrecta.
        </div>

    </div>

</div>


<!-- =========================
     PANEL DE ADMINISTRACIÓN
     ========================= -->

<div id="adminContent">

<main>

    <div class="title">

        <h1>
            Publicar
        </h1>

    </div>


    <!-- BOTONES -->

    <div class="preview-controls">

        <button
            type="button"
            id="editButton"
            class="active"
        >
            Editar
        </button>

        <button
            type="button"
            id="previewButton"
        >
            Vista previa
        </button>

    </div>


    <!-- VISTA PREVIA -->

    <div id="preview">

        <div
            class="preview-type"
            id="previewType"
        >
            Artículo
        </div>

        <h1 id="previewTitle">
            Título de la publicación
        </h1>

        <div
            class="preview-meta"
            id="previewMeta"
        >
            La Nación en Marcha · Fecha
        </div>

        <div
            class="preview-description"
            id="previewDescription"
        ></div>

        <div
            class="preview-content"
            id="previewContent"
        >
            Escribe contenido para ver la vista previa.
        </div>

        <div
            class="preview-pdf"
            id="previewPdf"
            style="display:none;"
        ></div>

    </div>


    <!-- EDITOR -->

    <form id="publishForm">


        <div class="form-row">

            <label for="title">
                Título
            </label>

            <input
                type="text"
                id="title"
                placeholder="Título de la publicación"
                required
            >

        </div>


        <div class="two-columns">


            <div class="form-row">

                <label for="author">
                    Autor
                </label>

                <input
                    type="text"
                    id="author"
                    placeholder="Nombre del autor"
                >

            </div>


            <div class="form-row">

                <label for="type">
                    Tipo de publicación
                </label>

                <select id="type">

                    <option value="articulo">
                        Artículo
                    </option>

                    <option value="ensayo">
                        Ensayo
                    </option>

                </select>

            </div>


        </div>


        <div class="form-row">

            <label for="date">
                Fecha
            </label>

            <input
                type="date"
                id="date"
            >

        </div>


        <div class="form-row">

            <label for="description">
                Introducción / descripción
            </label>

            <textarea
                id="description"
                placeholder="Escribe aquí una breve descripción..."
            ></textarea>

        </div>


        <div class="form-row">

            <label for="content">
                Contenido
            </label>

            <textarea
                id="content"
                placeholder="Escribe aquí el contenido..."
            ></textarea>

        </div>


        <div class="form-row">

            <label>
                PDF
            </label>

            <div class="file-box">

                <input
                    type="file"
                    id="pdf"
                    accept=".pdf,application/pdf"
                >

            </div>

        </div>


        <button type="submit">
            Publicar
        </button>


        <div
            class="notice"
            id="notice"
        >
            Publicación preparada correctamente.
        </div>


        <button
            type="button"
            class="logout"
            id="logout"
        >
            Cerrar sesión
        </button>


    </form>

</main>

</div>


<script>


/* =========================
   CONFIGURACIÓN
   ========================= */

const WORKER_URL =
    "https://la-nacion-publicador.fa-1118.workers.dev/";


/* =========================
   ELEMENTOS
   ========================= */

const loginScreen =
    document.getElementById(
        "loginScreen"
    );


const adminContent =
    document.getElementById(
        "adminContent"
    );


const loginForm =
    document.getElementById(
        "loginForm"
    );


const loginError =
    document.getElementById(
        "loginError"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const form =
    document.getElementById(
        "publishForm"
    );


const notice =
    document.getElementById(
        "notice"
    );


const logout =
    document.getElementById(
        "logout"
    );


const editButton =
    document.getElementById(
        "editButton"
    );


const previewButton =
    document.getElementById(
        "previewButton"
    );


const preview =
    document.getElementById(
        "preview"
    );


const previewType =
    document.getElementById(
        "previewType"
    );


const previewTitle =
    document.getElementById(
        "previewTitle"
    );


const previewMeta =
    document.getElementById(
        "previewMeta"
    );


const previewDescription =
    document.getElementById(
        "previewDescription"
    );


const previewContent =
    document.getElementById(
        "previewContent"
    );


const previewPdf =
    document.getElementById(
        "previewPdf"
    );


/* =========================
   VISTA PREVIA
   ========================= */

function actualizarVistaPrevia() {

    const titulo =
        document
            .getElementById("title")
            .value
            .trim() ||
        "Título de la publicación";


    const autor =
        document
            .getElementById("author")
            .value
            .trim() ||
        "La Nación en Marcha";


    const fecha =
        document
            .getElementById("date")
            .value ||
        "Fecha";


    const descripcion =
        document
            .getElementById("description")
            .value
            .trim();


    const contenido =
        document
            .getElementById("content")
            .value
            .trim() ||
        "Escribe contenido para ver la vista previa.";


    const tipo =
        document
            .getElementById("type")
            .value;


    const pdfInput =
        document
            .getElementById("pdf");


    previewType.textContent =
        tipo === "ensayo"
            ? "Ensayo"
            : "Artículo";


    previewTitle.textContent =
        titulo;


    previewMeta.textContent =
        autor + " · " + fecha;


    previewDescription.textContent =
        descripcion;


    previewDescription.style.display =
        descripcion
            ? "block"
            : "none";


    previewContent.textContent =
        contenido;


    if (
        tipo === "ensayo" &&
        pdfInput.files.length > 0
    ) {

        previewPdf.textContent =
            "PDF seleccionado: " +
            pdfInput.files[0].name;


        previewPdf.style.display =
            "block";

    } else {

        previewPdf.style.display =
            "none";

    }

}


/* =========================
   MOSTRAR EDITOR
   ========================= */

function mostrarEditor() {

    form.style.display =
        "block";

    preview.style.display =
        "none";


    editButton.classList.add(
        "active"
    );

    previewButton.classList.remove(
        "active"
    );

}


/* =========================
   MOSTRAR VISTA PREVIA
   ========================= */

function mostrarVistaPrevia() {

    actualizarVistaPrevia();


    form.style.display =
        "none";

    preview.style.display =
        "block";


    editButton.classList.remove(
        "active"
    );

    previewButton.classList.add(
        "active"
    );


    preview.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });

}


editButton.addEventListener(
    "click",
    mostrarEditor
);


previewButton.addEventListener(
    "click",
    mostrarVistaPrevia
);


/* Actualizar los datos
   de la vista previa */

[
    "title",
    "author",
    "date",
    "description",
    "content",
    "type",
    "pdf"
].forEach(id => {

    document
        .getElementById(id)
        .addEventListener(
            "input",
            actualizarVistaPrevia
        );


    document
        .getElementById(id)
        .addEventListener(
            "change",
            actualizarVistaPrevia
        );

});


/* =========================
   SESIÓN
   ========================= */

let adminPassword =
    sessionStorage.getItem(
        "adminPassword"
    );


function mostrarPanel() {

    loginScreen.style.display =
        "none";

    adminContent.style.display =
        "block";

}


function mostrarLogin() {

    loginScreen.style.display =
        "block";

    adminContent.style.display =
        "none";

    passwordInput.value = "";

}


/* =========================
   COMPROBAR CONTRASEÑA
   ========================= */

async function comprobarPassword(
    password
) {

    try {

        const response =
            await fetch(
                WORKER_URL,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "X-Admin-Password":
                            password

                    },

                    body:
                        JSON.stringify({
                            prueba: true
                        })

                }
            );


        if (
            response.status === 401
        ) {

            return false;

        }


        return true;


    } catch (error) {

        return true;

    }

}


/* =========================
   LOGIN
   ========================= */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const password =
            passwordInput.value;


        loginError.style.display =
            "none";


        if (!password) {
            return;
        }


        const correcta =
            await comprobarPassword(
                password
            );


        if (!correcta) {

            loginError.style.display =
                "block";

            passwordInput.focus();

            return;

        }


        adminPassword =
            password;


        sessionStorage.setItem(
            "adminPassword",
            password
        );


        mostrarPanel();

    }
);


/* =========================
   SESIÓN EXISTENTE
   ========================= */

if (adminPassword) {

    mostrarPanel();

}


/* =========================
   CERRAR SESIÓN
   ========================= */

logout.addEventListener(
    "click",
    function() {

        sessionStorage.removeItem(
            "adminPassword"
        );


        adminPassword =
            null;


        mostrarLogin();

    }
);


/* =========================
   PUBLICAR
   ========================= */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const titulo =
            document
                .getElementById("title")
                .value
                .trim();


        const autor =
            document
                .getElementById("author")
                .value
                .trim();


        const fecha =
            document
                .getElementById("date")
                .value;


        const descripcion =
            document
                .getElementById("description")
                .value
                .trim();


        const contenido =
            document
                .getElementById("content")
                .value
                .trim();


        const tipo =
            document
                .getElementById("type")
                .value;


        const pdfInput =
            document
                .getElementById("pdf");


        notice.style.display =
            "block";


        notice.textContent =
            "Publicando...";


        try {


            /* =========================
               ENSAYO
               ========================= */

            if (
                tipo === "ensayo"
            ) {

                if (!titulo) {

                    throw new Error(
                        "Escribe el título del ensayo."
                    );

                }


                if (
                    !pdfInput ||
                    pdfInput.files.length === 0
                ) {

                    throw new Error(
                        "Selecciona un PDF para el ensayo."
                    );

                }


                const archivo =
                    pdfInput.files[0];


                if (
                    archivo.type !==
                    "application/pdf"
                ) {

                    throw new Error(
                        "El archivo seleccionado no es un PDF."
                    );

                }


                if (
                    archivo.size >
                    10 * 1024 * 1024
                ) {

                    throw new Error(
                        "El PDF supera el límite de 10 MB."
                    );

                }


                notice.textContent =
                    "Subiendo PDF...";


                const response =
                    await fetch(
                        WORKER_URL,
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/pdf",

                                "X-File-Name":
                                    archivo.name,

                                "X-Admin-Password":
                                    adminPassword

                            },

                            body:
                                archivo

                        }
                    );


                const resultado =
                    await response.json();


                if (
                    !response.ok
                ) {

                    if (
                        response.status ===
                        401
                    ) {

                        sessionStorage.removeItem(
                            "adminPassword"
                        );

                        adminPassword =
                            null;

                        mostrarLogin();

                        throw new Error(
                            "Sesión no autorizada. Vuelve a introducir la contraseña."
                        );

                    }


                    throw new Error(
                        resultado.mensaje ||
                        JSON.stringify(
                            resultado
                        )
                    );

                }


                notice.textContent =
                    "✓ " +
                    resultado.mensaje +
                    " Archivo: " +
                    resultado.archivo;


                form.reset();

                actualizarVistaPrevia();

                mostrarEditor();

            }


            /* =========================
               ARTÍCULO
               ========================= */

            else {

                if (!titulo) {

                    throw new Error(
                        "Escribe un título."
                    );

                }


                if (!contenido) {

                    throw new Error(
                        "Escribe el contenido."
                    );

                }


                const response =
                    await fetch(
                        WORKER_URL,
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "X-Admin-Password":
                                    adminPassword

                            },

                            body:
                                JSON.stringify({

                                    titulo:
                                        titulo,

                                    autor:
                                        autor,

                                    fecha:
                                        fecha,

                                    contenido:
                                        contenido

                                })

                        }
                    );


                const resultado =
                    await response.json();


                if (
                    !response.ok
                ) {

                    if (
                        response.status ===
                        401
                    ) {

                        sessionStorage.removeItem(
                            "adminPassword"
                        );

                        adminPassword =
                            null;

                        mostrarLogin();

                        throw new Error(
                            "Sesión no autorizada. Vuelve a introducir la contraseña."
                        );

                    }


                    throw new Error(
                        resultado.mensaje ||
                        JSON.stringify(
                            resultado
                        )
                    );

                }


                notice.textContent =
                    "✓ " +
                    resultado.mensaje +
                    " Archivo: " +
                    resultado.archivo;


                form.reset();

                actualizarVistaPrevia();

                mostrarEditor();

            }


        } catch (error) {

            notice.textContent =
                "ERROR: " +
                error.message;

        }


        notice.scrollIntoView({
            behavior: "smooth"
        });

    }
);

</script>


</body>

</html>
