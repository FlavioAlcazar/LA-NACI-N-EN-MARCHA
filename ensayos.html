<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ensayos — La Nación en Marcha</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #dededb;
            color: #111;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* CABECERA */

        header {
            background: #111;
            color: #eee;
            padding: 25px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 8px solid #999;
        }

        .logo {
            font-size: clamp(22px, 4vw, 42px);
            font-weight: 900;
            line-height: .85;
            text-transform: uppercase;
            letter-spacing: -2px;
        }

        nav {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        nav a {
            color: #eee;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        nav a:hover {
            color: #aaa;
        }

        /* CONTENIDO */

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 5%;
        }

        .page-title {
            border-bottom: 8px solid #111;
            padding-bottom: 30px;
            margin-bottom: 60px;
        }

        .page-title h1 {
            margin: 0;
            font-size: clamp(60px, 10vw, 130px);
            line-height: .8;
            letter-spacing: -7px;
            text-transform: uppercase;
        }

        /* ENSAYOS */

        .essay {
            border-top: 3px solid #111;
            padding: 35px 0 50px;
        }

        .essay-label {
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .essay h2 {
            max-width: 1000px;
            margin: 0 0 20px;
            font-size: clamp(38px, 6vw, 70px);
            line-height: .9;
            letter-spacing: -3px;
            text-transform: uppercase;
        }

        .description {
            max-width: 750px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 19px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .meta {
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .pdf {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 18px;
            background: #111;
            color: #eee;
            text-decoration: none;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .pdf:hover {
            background: #555;
        }

        /* ESTADOS */

        .loading,
        .empty,
        .error {
            border-top: 2px solid #111;
            padding: 30px 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 20px;
            line-height: 1.5;
        }

        /* PIE */

        footer {
            background: #111;
            color: #aaa;
            padding: 35px 5%;
            font-size: 11px;
            text-transform: uppercase;
        }

        /* MÓVIL */

        @media (max-width: 700px) {

            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }

            nav {
                gap: 15px;
            }

            .essay h2 {
                letter-spacing: -2px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        La Nación<br>
        en Marcha
    </div>


    <nav>

        <a href="index.html">Inicio</a>
        <a href="articulos.html">Artículos</a>
        <a href="ensayos.html">Ensayos</a>
        <a href="temas.html">Temas</a>
        <a href="proyecto.html">Proyecto</a>
        <a href="contacto.html">Contacto</a>
        <a href="admin.html">Administración</a>

    </nav>

</header>


<main>


    <div class="page-title">

        <h1>
            Ensayos
        </h1>

    </div>


    <div id="ensayos">

        <div class="loading">
            Cargando ensayos...
        </div>

    </div>


</main>


<footer>

    La Nación en Marcha · 2026

</footer>


<script>

const contenedor =
    document.getElementById("ensayos");


const API =
    "https://api.github.com/repos/FlavioAlcazar/LA-NACI-N-EN-MARCHA/contents/ensayos";


async function cargarEnsayos() {

    try {

        const respuesta =
            await fetch(API);


        /*
         * Si la carpeta todavía no existe,
         * mostramos simplemente que no hay ensayos.
         */

        if (respuesta.status === 404) {

            mostrarVacio();

            return;

        }


        if (!respuesta.ok) {

            throw new Error(
                "No se pudieron cargar los ensayos."
            );

        }


        const archivos =
            await respuesta.json();


        /*
         * Buscamos únicamente archivos PDF.
         */

        const ensayos =
            archivos.filter(
                archivo =>
                    archivo.type === "file" &&
                    archivo.name
                        .toLowerCase()
                        .endsWith(".pdf")
            );


        if (ensayos.length === 0) {

            mostrarVacio();

            return;

        }


        contenedor.innerHTML = "";


        /*
         * Mostramos los PDF encontrados.
         */

        ensayos.reverse().forEach(
            archivo => {

                const ensayo =
                    document.createElement(
                        "article"
                    );


                ensayo.className =
                    "essay";


                const nombre =
                    archivo.name
                        .replace(
                            /\.pdf$/i,
                            ""
                        )
                        .replace(
                            /[-_]+/g,
                            " "
                        )
                        .trim();


                const titulo =
                    nombre ||
                    "Ensayo";


                const urlPDF =
                    archivo.download_url ||
                    (
                        "https://raw.githubusercontent.com/" +
                        "FlavioAlcazar/LA-NACI-N-EN-MARCHA/" +
                        "main/ensayos/" +
                        encodeURIComponent(
                            archivo.name
                        )
                    );


                ensayo.innerHTML = `

                    <div class="essay-label">
                        Ensayo
                    </div>


                    <h2>
                        ${escapeHtml(titulo)}
                    </h2>


                    <div class="description">
                        Documento publicado en
                        La Nación en Marcha.
                    </div>


                    <a
                        class="pdf"
                        href="${urlPDF}"
                        target="_blank"
                        rel="noopener"
                    >
                        Abrir PDF
                    </a>

                `;


                contenedor.appendChild(
                    ensayo
                );

            }
        );


    } catch (error) {

        console.error(
            "Error cargando ensayos:",
            error
        );


        contenedor.innerHTML = `

            <div class="error">

                No se han podido cargar
                los ensayos.

            </div>

        `;

    }

}


/* MENSAJE CUANDO NO HAY ENSAYOS */

function mostrarVacio() {

    contenedor.innerHTML = `

        <div class="empty">

            Todavía no hay ensayos publicados.

        </div>

    `;

}


/* PROTECCIÓN CONTRA HTML */

function escapeHtml(texto) {

    return String(texto)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


cargarEnsayos();

</script>


</body>

</html>
```
