<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Artículos — La Nación en Marcha</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #dededb;
            color: #111;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* =========================
           CABECERA
           ========================= */

        header {
            background: #111;
            color: #eee;
            padding: 25px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 8px solid #999;
        }

        .logo {
            font-size: clamp(22px, 4vw, 42px);
            font-weight: 900;
            line-height: .85;
            text-transform: uppercase;
            letter-spacing: -2px;
        }

        nav {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        nav a {
            color: #eee;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        nav a:hover {
            color: #aaa;
        }

        /* =========================
           CONTENIDO
           ========================= */

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 5%;
        }

        .page-title {
            border-bottom: 8px solid #111;
            padding-bottom: 30px;
            margin-bottom: 60px;
        }

        .page-title h1 {
            margin: 0;
            font-size: clamp(60px, 10vw, 130px);
            line-height: .8;
            letter-spacing: -7px;
            text-transform: uppercase;
        }

        /* =========================
           ARTÍCULOS
           ========================= */

        .article {
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 40px;
            border-top: 2px solid #111;
            padding: 30px 0;
        }

        .category {
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .article h2 {
            margin: 0 0 15px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(30px, 5vw, 50px);
            line-height: 1;
            letter-spacing: -1px;
        }

        .article h2 a {
            color: #111;
            text-decoration: none;
        }

        .article h2 a:hover {
            text-decoration: underline;
        }

        .article p {
            max-width: 700px;
            margin: 0 0 20px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 18px;
            line-height: 1.5;
        }

        .meta {
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* =========================
           ESTADOS
           ========================= */

        .loading,
        .empty,
        .error {
            border-top: 2px solid #111;
            padding: 30px 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 20px;
            line-height: 1.5;
        }

        /* =========================
           PIE
           ========================= */

        footer {
            background: #111;
            color: #aaa;
            padding: 35px 5%;
            font-size: 11px;
            text-transform: uppercase;
        }

        /* =========================
           MÓVIL
           ========================= */

        @media (max-width: 700px) {

            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }

            nav {
                gap: 15px;
            }

            .article {
                grid-template-columns: 1fr;
                gap: 15px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        La Nación<br>
        en Marcha
    </div>


    <nav>

        <a href="index.html">Inicio</a>
        <a href="articulos.html">Artículos</a>
        <a href="ensayos.html">Ensayos</a>
        <a href="temas.html">Temas</a>
        <a href="proyecto.html">Proyecto</a>
        <a href="contacto.html">Contacto</a>
        <a href="admin.html">Administración</a>

    </nav>

</header>


<main>


    <div class="page-title">

        <h1>
            Artículos
        </h1>

    </div>


    <div id="articles">

        <div class="loading">
            Cargando artículos...
        </div>

    </div>


</main>


<footer>

    La Nación en Marcha · 2026

</footer>


<script>

/* =========================
   CONFIGURACIÓN
   ========================= */

const API =
    "https://api.github.com/repos/FlavioAlcazar/LA-NACI-N-EN-MARCHA/contents/articulos";


const contenedor =
    document.getElementById(
        "articles"
    );


/* =========================
   CARGAR ARTÍCULOS
   ========================= */

async function cargarArticulos() {

    try {

        const respuesta =
            await fetch(API);


        if (
            respuesta.status === 404
        ) {

            mostrarVacio();

            return;

        }


        if (
            !respuesta.ok
        ) {

            throw new Error(
                "No se pudo acceder a los artículos."
            );

        }


        const archivos =
            await respuesta.json();


        /*
         * El Worker publica los artículos
         * como archivos HTML dentro de
         * /articulos.
         */

        const archivosHTML =
            archivos.filter(
                archivo =>
                    archivo.type === "file" &&
                    archivo.name
                        .toLowerCase()
                        .endsWith(".html")
            );


        if (
            archivosHTML.length === 0
        ) {

            mostrarVacio();

            return;

        }


        const articulos = [];


        /* =========================
           LEER CADA ARTÍCULO
           ========================= */

        for (
            const archivo of archivosHTML
        ) {

            try {

                const respuestaArticulo =
                    await fetch(
                        archivo.download_url
                    );


                if (
                    !respuestaArticulo.ok
                ) {

                    continue;

                }


                const html =
                    await respuestaArticulo.text();


                const documento =
                    new DOMParser()
                        .parseFromString(
                            html,
                            "text/html"
                        );


                const titulo =
                    documento
                        .querySelector("h1")
                        ?.textContent
                        .trim()
                    ||
                    archivo.name
                        .replace(
                            /\.html$/i,
                            ""
                        )
                        .replace(
                            /[-_]+/g,
                            " "
                        );


                const meta =
                    documento
                        .querySelector(".meta")
                        ?.textContent
                        .trim()
                    ||
                    "";


                const contenido =
                    documento
                        .querySelector(".content")
                        ?.textContent
                        .trim()
                    ||
                    "";


                /*
                 * Extraemos la fecha del
                 * bloque .meta.
                 */

                const fecha =
                    extraerFecha(
                        meta
                    );


                /*
                 * Generamos una descripción
                 * automática a partir del contenido.
                 */

                const descripcion =
                    contenido.length > 220
                        ? contenido.substring(
                            0,
                            220
                        ) + "..."
                        : contenido;


                articulos.push({

                    archivo:
                        archivo.name,

                    titulo:
                        titulo,

                    meta:
                        meta,

                    descripcion:
                        descripcion,

                    fecha:
                        fecha

                });


            } catch (error) {

                console.error(
                    "No se pudo leer el artículo:",
                    archivo.name,
                    error
                );

            }

        }


        if (
            articulos.length === 0
        ) {

            mostrarVacio();

            return;

        }


        /* =========================
           ORDENAR POR FECHA
           ========================= */

        articulos.sort(
            (a, b) => {

                return (
                    b.fecha || ""
                ).localeCompare(
                    a.fecha || ""
                );

            }
        );


        /* =========================
           MOSTRAR
           ========================= */

        contenedor.innerHTML = "";


        articulos.forEach(
            articulo => {

                const elemento =
                    document.createElement(
                        "article"
                    );


                elemento.className =
                    "article";


                /*
                 * Los artículos generados
                 * por el Worker viven dentro
                 * de la carpeta /articulos.
                 */

                const enlace =
                    "articulos/" +
                    encodeURIComponent(
                        articulo.archivo
                    );


                elemento.innerHTML = `

                    <div class="category">

                        Artículo

                    </div>


                    <div>

                        <h2>

                            <a
                                href="${escaparAtributo(
                                    enlace
                                )}"
                            >

                                ${escaparHTML(
                                    articulo.titulo
                                )}

                            </a>

                        </h2>


                        ${
                            articulo.descripcion
                                ? `

                                    <p>

                                        ${escaparHTML(
                                            articulo.descripcion
                                        )}

                                    </p>

                                `
                                : ""
                        }


                        ${
                            articulo.meta
                                ? `

                                    <div class="meta">

                                        ${escaparHTML(
                                            articulo.meta
                                        )}

                                    </div>

                                `
                                : ""
                        }

                    </div>

                `;


                contenedor.appendChild(
                    elemento
                );

            }
        );


    } catch (error) {

        console.error(
            "Error cargando artículos:",
            error
        );


        contenedor.innerHTML = `

            <div class="error">

                No se han podido cargar
                los artículos.

            </div>

        `;

    }

}


/* =========================
   SIN ARTÍCULOS
   ========================= */

function mostrarVacio() {

    contenedor.innerHTML = `

        <div class="empty">

            Todavía no hay artículos publicados.

        </div>

    `;

}


/* =========================
   EXTRAER FECHA
   ========================= */

function extraerFecha(
    texto
) {

    if (
        !texto
    ) {

        return "";

    }


    const coincidencia =
        texto.match(
            /\d{4}-\d{2}-\d{2}/
        );


    return coincidencia
        ? coincidencia[0]
        : "";

}


/* =========================
   ESCAPAR HTML
   ========================= */

function escaparHTML(
    texto
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        texto || "";


    return div.innerHTML;

}


/* =========================
   ESCAPAR ATRIBUTOS
   ========================= */

function escaparAtributo(
    texto
) {

    return String(
        texto || ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        );

}


/* =========================
   INICIAR
   ========================= */

cargarArticulos();

</script>


</body>

</html>
```
