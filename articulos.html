<script>

const contenedor =
    document.getElementById("articles");


const API =
    "https://api.github.com/repos/FlavioAlcazar/LA-NACI-N-EN-MARCHA/contents/articulos";


async function cargarArticulos() {

    try {

        const respuesta =
            await fetch(API);


        if (!respuesta.ok) {

            throw new Error(
                "No se pudo acceder a la carpeta de artículos."
            );

        }


        const archivos =
            await respuesta.json();


        const articulos =
            archivos.filter(
                archivo =>
                    archivo.type === "file" &&
                    archivo.name
                        .toLowerCase()
                        .endsWith(".html") &&
                    archivo.name
                        .toLowerCase() !== "pdf.html"
            );


        if (articulos.length === 0) {

            contenedor.innerHTML = `

                <div class="empty">
                    Todavía no hay artículos publicados.
                </div>

            `;

            return;

        }


        const datos = [];


        for (
            const archivo of articulos
        ) {

            try {

                const respuestaArticulo =
                    await fetch(
                        archivo.download_url
                    );


                if (!respuestaArticulo.ok) {
                    continue;
                }


                const html =
                    await respuestaArticulo.text();


                const documento =
                    new DOMParser()
                        .parseFromString(
                            html,
                            "text/html"
                        );


                const titulo =
                    documento
                        .querySelector("h1")
                        ?.textContent
                        .trim()
                    ||
                    archivo.name
                        .replace(
                            /\.html$/i,
                            ""
                        )
                        .replace(
                            /-/g,
                            " "
                        );


                const meta =
                    documento
                        .querySelector(".meta")
                        ?.textContent
                        .trim()
                    ||
                    "";


                const contenido =
                    documento
                        .querySelector(".content")
                        ?.textContent
                        .trim()
                    ||
                    "";


                const descripcion =
                    contenido.length > 220
                        ? contenido.substring(
                            0,
                            220
                        ) + "..."
                        : contenido;


                datos.push({

                    archivo:
                        archivo.name,

                    titulo:
                        titulo,

                    meta:
                        meta,

                    descripcion:
                        descripcion

                });


            } catch (error) {

                console.error(
                    "No se pudo leer:",
                    archivo.name,
                    error
                );

            }

        }


        if (datos.length === 0) {

            contenedor.innerHTML = `

                <div class="empty">
                    Todavía no hay artículos publicados.
                </div>

            `;

            return;

        }


        contenedor.innerHTML = "";


        datos.reverse()
            .forEach(
                articulo => {

                    const elemento =
                        document
                            .createElement(
                                "article"
                            );


                    elemento.className =
                        "article";


                    /*
                     * Enlace directo al archivo
                     * dentro de la carpeta articulos.
                     */

                    const enlace =
                        "articulos/" +
                        encodeURIComponent(
                            articulo.archivo
                        );


                    elemento.innerHTML = `

                        <div class="category">
                            Artículo
                        </div>

                        <div>

                            <h2>

                                <a
                                    href="${enlace}"
                                >
                                    ${escaparHTML(
                                        articulo.titulo
                                    )}
                                </a>

                            </h2>


                            <p>
                                ${escaparHTML(
                                    articulo.descripcion
                                )}
                            </p>


                            <div class="meta">

                                ${escaparHTML(
                                    articulo.meta
                                )}

                            </div>

                        </div>

                    `;


                    contenedor.appendChild(
                        elemento
                    );

                }
            );


    } catch (error) {

        console.error(error);


        contenedor.innerHTML = `

            <div class="error">

                No se han podido cargar
                los artículos.

            </div>

        `;

    }

}


function escaparHTML(texto) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        texto;


    return div.innerHTML;

}


cargarArticulos();

</script>


</body>
